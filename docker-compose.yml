# ══════════════════════════════════════════════════════════════════════════════
# Learn 5 by 5 — Docker Compose
#
# Services:
#   app    → Web frontend  → http://localhost:5000
#   admin  → Admin panel   → http://localhost:8001
#
# Usage:
#   cp .env.example .env        # fill in your values
#   docker compose up --build
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── Web frontend ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: learn5by5-app
    container_name: l5b5-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Session security — required
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}

      # Backend API that the frontend proxies to
      API_BASE_URL: ${API_BASE_URL:-https://learn-5-by-5-api-backend.onrender.com/api/v1}

      # Google OAuth (optional — leave empty to disable Google Sign-In button)
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}

      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/splash')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Admin dashboard ───────────────────────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: learn5by5-admin
    container_name: l5b5-admin
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Same session secret as the main app
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}

      # Backend API base URL (used by admin for all data calls)
      API_BASE_URL: ${API_BASE_URL:-https://learn-5-by-5-api-backend.onrender.com/api/v1}

      # Admin credentials — set these to log in without a backend admin account
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # Optional: backend admin API key for authenticated API calls
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}

      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/login')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
