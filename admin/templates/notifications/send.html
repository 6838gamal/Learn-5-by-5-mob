{% extends "base.html" %}
{% block title %}Send Notifications{% endblock %}

{% block content %}
<div class="mb-6">
  <h2 class="text-2xl font-bold text-gray-800">Send Notifications</h2>
  <p class="text-gray-500 text-sm mt-1">Send push notifications to users</p>
</div>

<div class="bg-white rounded-xl border border-gray-200 p-6 max-w-lg">
  <form hx-post="/admin/notifications/send" hx-swap="outerHTML">
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Target</label>
      <select name="target" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
        <option value="all">All users</option>
        <option value="premium">Premium users</option>
        <option value="free">Free users</option>
      </select>
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
      <input type="text" name="title" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
    </div>
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1">Body</label>
      <textarea name="body" rows="4" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea>
    </div>
    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
      Send Notification
    </button>
  </form>
</div>
{% endblock %}
