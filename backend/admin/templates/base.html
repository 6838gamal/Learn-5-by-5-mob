<!DOCTYPE html>
<html lang="en" x-data="{ sidebarOpen: true }">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin{% endblock %} — Learn 5 by 5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 bg-indigo-900 text-white flex flex-col flex-shrink-0" x-show="sidebarOpen">
    <div class="px-6 py-5 border-b border-indigo-700">
      <h1 class="text-lg font-bold tracking-wide">Learn 5 by 5</h1>
      <p class="text-xs text-indigo-300 mt-0.5">Admin Dashboard</p>
    </div>

    <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto">
      <a href="/admin/dashboard" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium">
        📊 Dashboard
      </a>
      <a href="/admin/users" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium">
        👥 Users
      </a>
      <div x-data="{ open: false }">
        <button @click="open = !open" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium">
          📚 Content
          <svg class="ml-auto w-4 h-4 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div x-show="open" class="ml-4 mt-1 space-y-1">
          <a href="/admin/content/words" class="block px-3 py-1.5 rounded-lg hover:bg-indigo-700 text-sm">Words</a>
          <a href="/admin/content/daily-lessons" class="block px-3 py-1.5 rounded-lg hover:bg-indigo-700 text-sm">Daily Lessons</a>
        </div>
      </div>
      <a href="/admin/subscriptions/plans" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium">
        💳 Subscriptions
      </a>
      <a href="/admin/support/tickets" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium">
        🎫 Support
      </a>
      <a href="/admin/notifications" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium">
        🔔 Notifications
      </a>
      <a href="/admin/settings" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium">
        ⚙️ Settings
      </a>
    </nav>

    <div class="px-4 py-4 border-t border-indigo-700">
      <a href="/admin/logout" class="block px-3 py-2 rounded-lg hover:bg-indigo-700 text-sm text-indigo-300">
        🚪 Logout
      </a>
    </div>
  </aside>

  <!-- Main content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top bar -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center gap-4">
      <button @click="sidebarOpen = !sidebarOpen" class="text-gray-500 hover:text-gray-700">
        ☰
      </button>
      <div class="ml-auto flex items-center gap-4 text-sm text-gray-600">
        {% block header_actions %}{% endblock %}
      </div>
    </header>

    <!-- Page content -->
    <main class="flex-1 overflow-y-auto p-6">
      {% block content %}{% endblock %}
    </main>
  </div>

</div>
</body>
</html>
