<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Learn 5×5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: { 600:'#16a34a', 700:'#15803d' } } } } }</script>
</head>
<body class="min-h-screen bg-gradient-to-br from-brand-600 to-emerald-800 flex items-center justify-center p-4">
<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/20 backdrop-blur-sm mb-4">
      <span class="text-white font-black text-3xl">5</span>
    </div>
    <h1 class="text-white font-bold text-3xl">Learn 5×5</h1>
    <p class="text-white/80 mt-1 text-sm">Start your language journey</p>
  </div>

  <div class="bg-white rounded-3xl shadow-2xl p-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">Create your account</h2>

    {% if error %}
    <div class="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">{{ error }}</div>
    {% endif %}

    <form method="post" action="/auth/register" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Full name</label>
        <input type="text" name="full_name" required autocomplete="name"
               class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600"
               placeholder="Ali Hassan" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" required autocomplete="email"
               class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600"
               placeholder="you@example.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required minlength="8" autocomplete="new-password"
               class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600"
               placeholder="At least 8 characters" />
      </div>
      <button type="submit"
              class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm transition-colors">
        Create account
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Already have an account?
      <a href="/auth/login" class="text-brand-600 font-semibold hover:underline">Sign in</a>
    </p>
  </div>
</div>
</body>
</html>
