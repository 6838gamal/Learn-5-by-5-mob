<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Learn 5×5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: { 600:'#16a34a', 700:'#15803d' } } } } }</script>
</head>
<body class="min-h-screen bg-gradient-to-br from-brand-600 to-emerald-800 flex items-center justify-center p-4">
<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/20 mb-4">
      <span class="text-white font-black text-3xl">5</span>
    </div>
    <h1 class="text-white font-bold text-3xl">Learn 5×5</h1>
  </div>

  <div class="bg-white rounded-3xl shadow-2xl p-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Forgot password?</h2>
    <p class="text-gray-500 text-sm mb-6">Enter your email and we'll send you a reset link.</p>

    {% if sent %}
    <div class="p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 text-sm text-center">
      ✅ Check your inbox — a reset link has been sent.
    </div>
    <a href="/auth/login" class="block text-center text-brand-600 text-sm font-semibold mt-4 hover:underline">Back to sign in</a>
    {% else %}
      {% if error %}
      <div class="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">{{ error }}</div>
      {% endif %}
      <form method="post" action="/auth/forgot-password" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
          <input type="email" name="email" required
                 class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-600"
                 placeholder="you@example.com" />
        </div>
        <button type="submit"
                class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm transition-colors">
          Send reset link
        </button>
      </form>
      <a href="/auth/login" class="block text-center text-gray-500 text-sm mt-4 hover:underline">Back to sign in</a>
    {% endif %}
  </div>
</div>
</body>
</html>
